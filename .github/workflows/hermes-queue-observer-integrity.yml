name: Hermes queue observer integrity
on:
  push:
    branches:
      - main
      - docs/hermes-gpt-atomic-sdd-monitor-review-20261122
    paths:
      - Hermes-WebGPT/monitoring/**
      - .github/workflows/hermes-queue-observer-integrity.yml
  pull_request:
    paths:
      - Hermes-WebGPT/monitoring/**
      - .github/workflows/hermes-queue-observer-integrity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-observer-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Focused gate: test_confirmation_observation.py in base main imports
      # queue_monitor_baseline.py, a module absent from this checkout.
      # Its independent full-suite failure is recorded in the SDD, not hidden
      # or misclassified as a regression introduced by this patch.
      - name: Focused queue and quality observer regressions
        working-directory: Hermes-WebGPT/monitoring
        run: |
          python -m py_compile queue_monitor.py test_queue_monitor.py test_quality_observation.py
          python -m unittest -v test_queue_monitor test_quality_observation
