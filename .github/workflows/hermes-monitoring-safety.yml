name: Hermes monitoring safety regression

on:
  push:
    branches:
      - hermes/causal-queue-triage-sdd-20261122
    paths:
      - "Hermes-WebGPT/monitoring/**"
      - "Hermes-WebGPT/openspec/changes/add-causal-observation-triage/**"
      - ".github/workflows/hermes-monitoring-safety.yml"
  pull_request:
    paths:
      - "Hermes-WebGPT/monitoring/**"
      - "Hermes-WebGPT/openspec/changes/add-causal-observation-triage/**"
      - ".github/workflows/hermes-monitoring-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-monitoring-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-monitoring:
    name: Monitoring tests / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python syntax and bytecode compilation
        run: python -m compileall -q Hermes-WebGPT/monitoring
      - name: Actual queue_monitor + triage + sampler regression suite
        run: python -W error::ResourceWarning -m unittest discover -s Hermes-WebGPT/monitoring -p "test_*.py" -v
