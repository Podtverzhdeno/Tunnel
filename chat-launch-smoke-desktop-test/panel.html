<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Chat Smoke Test</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{margin:0;padding:20px;max-width:500px}h1{font-size:18px;margin:0 0 8px}p{line-height:1.5}
button{font:inherit;padding:10px 16px;border-radius:9px;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}#status{white-space:pre-wrap;font-size:13px}
</style></head>
<body>
<h1>New Chat — Smoke Test</h1>
<p>Проверяем официальный MCP Extensions <code>ui/message</code> с <code>target: new</code>.</p>
<button id="create" disabled>Создать тестовый чат</button>
<p id="status" role="status" aria-live="polite">Подключаюсь к ChatGPT host…</p>
<script>
(() => {
  'use strict';
  const button = document.getElementById('create');
  const status = document.getElementById('status');
  const prompt = 'Тест нового чата через MCP App. Ответь одним словом: ПРИНЯТО.';
  let nextId = 1, ready = false, busy = false;
  const pending = new Map();
  function setStatus(v) { status.textContent = v; }
  function request(method, params, timeout=12000) {
    return new Promise((resolve,reject) => {
      const id = nextId++;
      const timer = setTimeout(() => { pending.delete(id); reject(new Error('Host timeout')); }, timeout);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc:'2.0', id, method, params }, '*');
    });
  }
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0' || !Object.prototype.hasOwnProperty.call(msg,'id')) return;
    const p = pending.get(msg.id);
    if (!p) return;
    clearTimeout(p.timer);
    pending.delete(msg.id);
    if (msg.error) p.reject(new Error(String(msg.error.message || 'Host error')));
    else p.resolve(msg.result);
  });
  async function initialize() {
    try {
      const host = await request('ui/initialize', {
        protocolVersion:'2026-01-26',
        appInfo:{ name:'chat-launch-smoke',version:'0.1.0' },
        appCapabilities:{}
      });
      window.parent.postMessage({ jsonrpc:'2.0', method:'ui/notifications/initialized' }, '*');
      if (!host || !host.hostCapabilities ||
          !host.hostCapabilities.experimental ||
          !Object.prototype.hasOwnProperty.call(host.hostCapabilities.experimental, 'openai/message')) {
        setStatus('Этот host не объявляет openai/message. Создание нового чата здесь не поддерживается.');
        return;
      }
      ready = true;
      button.disabled = false;
      setStatus('Host поддерживает openai/message. Нажмите кнопку для проверки.');
    } catch(e) { setStatus('Ошибка подключения: ' + e.message); }
  }
  button.addEventListener('click', async () => {
    if (!ready || busy) return;
    busy = true;
    button.disabled = true;
    setStatus('Запрашиваю новый чат…');
    try {
      const result = await request('ui/message', {
        role:'user',
        content:[{type:'text',text:prompt}],
        _meta:{'openai/message':{target:'new',send:true}}
      });
      if (result?.isError) setStatus('Host отклонил отправку. Новый чат НЕ подтверждён.');
      else setStatus('Host принял запрос. Проверьте, появился ли новый чат и ответ «ПРИНЯТО». Сам ответ host не доказывает, что чат создан.');
    } catch(e) { setStatus('Запрос не подтверждён: ' + e.message); }
    finally { busy=false; button.disabled=false; }
  });
  initialize();
})();
</script>
</body></html>
